name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA)'
        required: false
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alloartisan_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ secrets.STAGING_HOST != '' && secrets.STAGING_USER != '' && secrets.STAGING_SSH_KEY != '' && secrets.STAGING_APP_PATH != '' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.STAGING_APP_PATH }}"
            git fetch --all --prune
            git checkout "${{ inputs.ref || 'develop' }}"
            git pull --ff-only
            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm prisma:dev:deploy
            pnpm build
            docker compose up -d --build

  deploy-skipped:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ !(secrets.STAGING_HOST != '' && secrets.STAGING_USER != '' && secrets.STAGING_SSH_KEY != '' && secrets.STAGING_APP_PATH != '') }}

    steps:
      - name: Explain skipped deploy
        run: |
          echo "Staging deploy skipped: missing required secrets."
          echo "Required: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_APP_PATH."
